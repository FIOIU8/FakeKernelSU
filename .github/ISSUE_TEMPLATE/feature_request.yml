name: 功能请求
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有相同请求。
        注意本项目是**演示版**：不增加任何真实 root / 内核能力，只做界面与演示逻辑。

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 这个功能解决什么问题？什么场景下需要？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望怎么实现 / 交互长什么样？有参考图最好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 实验室（控制面板）
        - 首页 / 安装流程
        - 超级用户 / su 日志
        - 模块
        - 设置 / 关于
        - 构建 / CI
        - 翻译
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我理解双 UI 约定（Material + Miuix 需同步实现）
          required: true
