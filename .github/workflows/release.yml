name: Release

# Manual only: cutting a release is a deliberate act. The workflow builds a
# release APK, pushes a semver tag (if missing) and submits a DRAFT GitHub
# Release. Nothing becomes public until a human publishes the draft.
# Release APKs are ALWAYS signed with the official certificate - the workflow
# fails fast when the signing secrets are missing (see the guard step below).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading "v", e.g. 1.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Extra release notes (Markdown). A changelog from git log is generated automatically.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "Guard - default branch only"
        if: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "::error::Releases can only be cut from the default branch (${{ github.event.repository.default_branch }}), current ref is ${{ github.ref_name }}."
          exit 1

      # Releases MUST be signed with the official certificate: a debug-signed
      # APK can never be updated in place by a properly signed one, so refuse
      # to cut a release without the secrets - and do it BEFORE anything is
      # created (no tag, no draft release).
      - name: Require signing secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "::error::Release builds are always signed with the official certificate."
            echo "::error::Add them under Settings > Secrets and variables > Actions (README section 5)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      # The tag is created locally before the build so that `git describe`
      # inside Gradle yields a clean version name, but it is only pushed
      # after a successful build (see "Push tag" below). Pushing it up front
      # left a stale tag on the remote whenever the build failed, and a
      # re-run with the same version then reused that stale tag - so the
      # published versionName referred to an older commit than the APK.
      - name: Create tag (local only)
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists locally. Move or delete it before releasing this version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on the remote. Pick a different version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "FakeKernelSU $TAG"
          echo "Created local tag $TAG (pushed after a successful build)."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # See ci.yml: the default "tools" package no longer exists in the
          # Android SDK repository, which makes sdkmanager exit 1.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          # See ci.yml: the platform package carries the minor API level
          # ("platforms;android-37.0"); read the values from the build script.
          COMPILE_SDK=$(grep -oP 'androidCompileSdkVersion"\]\s*=\s*\K[0-9]+' build.gradle.kts | head -1)
          MINOR=$(grep -oP 'androidCompileSdkVersionMinor"\]\s*=\s*\K[0-9]+' build.gradle.kts | head -1)
          BUILD_TOOLS=$(grep -oP 'androidBuildToolsVersion"\]\s*=\s*"\K[0-9.]+' build.gradle.kts | head -1)
          echo "Installing platforms;android-${COMPILE_SDK}.${MINOR} and build-tools;${BUILD_TOOLS}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${COMPILE_SDK}.${MINOR}" "build-tools;${BUILD_TOOLS}"

      # The guard step already failed on missing secrets; here verify that the
      # decoded keystore really contains the alias - this catches wrong
      # passwords and corrupted base64 before the multi-minute build.
      - name: Verify keystore
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -q "PrivateKeyEntry" || {
            echo "::error::Keystore does not contain alias '$KEY_ALIAS', or the store password is wrong."
            exit 1
          }
          echo "Keystore OK, alias '$KEY_ALIAS' found."

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building release APK signed with alias '$KEY_ALIAS'."
          ./gradlew assembleRelease --no-daemon \
            -PKEYSTORE_FILE="$KEYSTORE_FILE" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      # Only now that a signed APK exists: publish the tag. If anything above
      # failed, the tag stays local and the remote never sees a version that
      # was never built.
      - name: Push tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git push origin "refs/tags/$TAG"
          echo "Pushed tag $TAG."

      - name: Collect APK and checksum
        id: apk
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # Keep the name Gradle produced ("FakeKernelSU_v1.1.0_30031-release.apk"):
          # the in-app update check parses the versionCode out of it
          # (see ui/util/Downloader.kt), so renaming it would break the check.
          OUT=$(basename "$APK")
          cp "$APK" "$RUNNER_TEMP/$OUT"
          (cd "$RUNNER_TEMP" && sha256sum "$OUT" > "$OUT.sha256")
          echo "dir=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            # tformat (not format) so every line, including the last, is newline-terminated
            git log --pretty=tformat:"- %s (%h)" "$PREV_TAG..$TAG" > changes.txt || true
          else
            git log --pretty=tformat:"- %s (%h)" "$TAG" > changes.txt || true
          fi
          [ -s changes.txt ] || echo "- No changes recorded." > changes.txt
          {
            echo "## FakeKernelSU $TAG"
            echo
            echo "- APK: \`${{ steps.apk.outputs.name }}\`"
            echo "- Version name: $(git describe --tags)"
            echo
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
              echo
            fi
            echo "### Changes since previous tag"
            echo
            cat changes.txt
          } > body.md

      # Draft only - a human reviews and publishes it from the Releases page.
      # The body is passed via body_path (a file) - writing multiline values
      # through GITHUB_OUTPUT heredocs breaks when the content does not end
      # with a newline ("Matching delimiter not found").
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: FakeKernelSU ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease == true }}
          body_path: body.md
          files: |
            ${{ steps.apk.outputs.dir }}/${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.dir }}/${{ steps.apk.outputs.file }}.sha256
