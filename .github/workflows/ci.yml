name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check whether upstream tiann/KernelSU moved on.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-divergence:
    name: Upstream divergence guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The fork's own rules, checked against the recorded baseline:
      #   * every upstream file the fork changes or removes is declared in
      #     tools/upstream/allowlist.txt
      #   * res/values*/strings.xml stays byte-identical to upstream
      #   * no resource name is defined twice in one configuration
      #   * no name in fake_strings.xml collides with an upstream name
      - name: Verify divergence from the upstream baseline
        shell: pwsh
        run: ./tools/verify-divergence.ps1

  upstream-sync-check:
    name: Upstream sync check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Full history, not --depth=1: the merge preview below needs the real
      # merge base (recorded by the graft commit, see docs/upstream-sync.md).
      - name: Fetch upstream tiann/KernelSU
        run: |
          git fetch --no-tags \
            https://github.com/tiann/KernelSU.git main:refs/remotes/upstream/main
          git rev-parse refs/remotes/upstream/main
          echo "merge base: $(git merge-base HEAD refs/remotes/upstream/main || echo none)"

      # Fails when upstream moved on: files the fork has not picked up yet, or
      # files upstream and the fork both changed (those need a manual merge).
      # Run tools/sync-upstream.ps1 locally to see the same list.
      - name: Check for sync drift
        shell: pwsh
        run: ./tools/verify-divergence.ps1 -UpstreamRef refs/remotes/upstream/main -SyncRequired

      # The graft gives the fork a real 3-way merge base, so "would the merge
      # conflict?" can be answered before the maintainer starts one. This step
      # never fails the job: a conflict in an allowlisted file is expected
      # (the fork edits it on purpose), it just needs a human.
      - name: Preview the 3-way merge
        shell: bash
        run: |
          set -uo pipefail
          if git -c user.name=ci -c user.email=ci@example.invalid \
               merge --no-commit --no-ff -X subtree=manager refs/remotes/upstream/main; then
            echo "::notice::Merge preview: no conflicts."
          else
            echo "::warning::The 3-way merge would conflict in:"
            git diff --name-only --diff-filter=U | sed 's/^/  /' || true
            echo "Resolve them by hand, or run tools/sync-upstream.ps1 instead."
          fi
          git merge --abort || true

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      # The version code / version name are generated from git
      # (rev-list --count / describe), so a full clone with tags is required.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to "tools platform-tools", but Google removed
          # the legacy "tools" package from the SDK repository ("Failed to
          # find package 'tools'" -> sdkmanager exits 1). Only cmdline-tools
          # and platform-tools are needed; the rest is installed explicitly.
          packages: platform-tools

      - name: Install SDK packages
        run: |
          # The project uses AGP 9's minor-API-level DSL
          # (compileSdk { version = release(37) { minorApiLevel = 0 } }), so the
          # platform package is "platforms;android-37.0" - the bare
          # "platforms;android-37" does not exist in the SDK repository.
          # Read the values from the root build script so CI tracks the project.
          COMPILE_SDK=$(grep -oP 'androidCompileSdkVersion"\]\s*=\s*\K[0-9]+' build.gradle.kts | head -1)
          MINOR=$(grep -oP 'androidCompileSdkVersionMinor"\]\s*=\s*\K[0-9]+' build.gradle.kts | head -1)
          BUILD_TOOLS=$(grep -oP 'androidBuildToolsVersion"\]\s*=\s*"\K[0-9.]+' build.gradle.kts | head -1)
          if [ -z "$COMPILE_SDK" ] || [ -z "$MINOR" ] || [ -z "$BUILD_TOOLS" ]; then
            echo "::error::Failed to read SDK versions from build.gradle.kts"
            exit 1
          fi
          echo "Installing platforms;android-${COMPILE_SDK}.${MINOR} and build-tools;${BUILD_TOOLS}"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-${COMPILE_SDK}.${MINOR}" "build-tools;${BUILD_TOOLS}"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release exercises R8 minification / resource shrinking.
      # Without keystore secrets it is signed with the debug certificate
      # (see app/build.gradle.kts), so this build always succeeds.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # The 12 unit tests that came in with the upstream import never ran in
      # this fork's CI. Run them so a regression in the (unmodified) upstream
      # code is caught here too.
      - name: Run unit tests
        run: ./gradlew test --no-daemon

      # FakeKernelSU advertises "no native libraries at all" - keep CI honest.
      # Note: the APK file name is derived from archivesName, so glob it.
      #
      # Both variants are checked: the published APK is the release one, and a
      # dependency that only ships a .so into the release variant must not
      # slip through. `set -euo pipefail` matters here: without it a failed
      # `ls` would leave $apk empty, `unzip -l ""` would fail, the `if` would
      # be false and the step would report "OK" for an APK that was never
      # inspected.
      - name: Verify no native libraries in APK
        shell: bash
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            if [ ! -f "$apk" ]; then
              echo "::error::No APK found at $apk"
              exit 1
            fi
            if unzip -l "$apk" | grep -q '\.so'; then
              echo "::error::$apk contains native libraries, breaking the 'pure demo' promise"
              unzip -l "$apk" | grep '\.so'
              exit 1
            fi
            echo "OK: no .so files in $apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeKernelSU-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The release variant built here has no keystore, so it is signed with
      # the debug certificate. It is uploaded for inspection only: a
      # debug-signed APK can never be updated in place by the officially
      # signed release (INSTALL_FAILED_UPDATE_INCOMPATIBLE), so installing
      # this artifact would block the user from ever installing a real
      # release without uninstalling first - and uninstalling deletes all
      # demo data. The name says so out loud.
      - name: Upload release APK (debug-signed, for inspection only)
        uses: actions/upload-artifact@v4
        with:
          name: FakeKernelSU-release-debug-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
