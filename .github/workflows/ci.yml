name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      # The version code / version name are generated from git
      # (rev-list --count / describe), so a full clone with tags is required.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Release exercises R8 minification / resource shrinking.
      # Without keystore secrets it is signed with the debug certificate
      # (see app/build.gradle.kts), so this build always succeeds.
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # FakeKernelSU advertises "no native libraries at all" - keep CI honest.
      - name: Verify no native libraries in APK
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$apk" | grep -q '\.so'; then
            echo "::error::APK contains native libraries, breaking the 'pure demo' promise"
            unzip -l "$apk" | grep '\.so'
            exit 1
          fi
          echo "OK: no .so files in $apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeKernelSU-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeKernelSU-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
